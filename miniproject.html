    <style>
        .daftar-buku {
            display: grid;
            grid-template-columns: 40px 150px 150px 100px 130px 150px;
            width: max-content;
        }

        .kolom {
            padding: 3px 8px;
        }

        .judul {
            font-weight: bold;
        }
    </style>
</head>
<body>


    <h1>Daftar Koleksi Buku Perpustakaan</h1>

    <h2>Daftar Koleksi buku</h2>
      
</body>
</html>
<table>
        <tr>
            <th>No.</th>
            <th>Judul Buku</th>
            <th>Penulis</th>
            <th>Tahun Terbit</th>
            <th>Jumlah Halaman</th>
            <th>Genre</th>
        </tr>

        <tr>

    <h2>Tambah Buku Baru</h2>

    <form>

        <p>
            <label for="judul">Judul Buku:</label>
            <input 
                type="text" 
                id="judul" 
                name="judul"
                placeholder="Masukkan judul buku"
                maxlength="100"
                required
          >
        
        </p>

        <p>
            <label for="penulis">Penulis:</label>
            <input 
                type="text" 
                id="penulis" 
                name="penulis"
                placeholder="Masukkan nama penulis"
                maxlength="70"
                required
            >
        </p>

         <p>
            <label for="tahun">Tahun Terbit:</label>
            <input 
                type="number" 
                id="tahun" 
                name="tahun"
                min="1000"
                max="2025"
                placeholder="eg. 2023"
                required
            >
        </p>

         <p>
            <label for="halaman">Jumlah Halaman:</label>
            <input 
                type="number" 
                id="halaman" 
                name="halaman"
                min="1"
                placeholder="eg. 300"
                required
            >
        </p>

          <p>
            <label for="genre">Genre:</label>
            <select id="genre" name="genre" required>
                <option value="">Pilih Genre</option>
                <option value="Filosofi">Filosofi</option>
                <option value="Pengembangan Diri">Pengembangan Diri</option>
                <option value="Horor">Horor</option>
            </select>
        </p>
